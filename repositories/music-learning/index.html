    alt:'One octave showing a four-semitone gap from C to E and a one-semitone gap from E to F.',
    caption:'Letters next to each other are not the same distance apart. <b>C to E</b> spans four keys. <b>E to F</b> spans one, because there is no black key between them. Both are “one letter apart” on paper and nothing alike in sound.'},
   widget:{kind:'keys',mode:'interval',low:55,high:79,
    title:'Measure any interval',
    hint:'Press one key, then a second. It plays both in turn and tells you the gap in semitones along with the interval’s name.',
    say:'Press one key, then a second one.'}},
  {h:'The intervals worth knowing by ear',
   p:['Intervals have names, and the names carry meaning. The octave you met last lesson is 12 semitones. The <b>perfect fifth</b> (7) is open and stable — it is the sound of a power chord. The <b>major third</b> (4) is bright and sweet, and the <b>minor third</b> (3), one semitone narrower, is the single most reliable way to make music sound sad.',
      'That last pair is the important one. Major and minor thirds differ by one key out of twelve, and almost all of the emotional difference between a happy chord and a mournful one comes down to that single semitone.'],

     {label:'Minor third',note:'C4 → E♭4 · 3 semitones',arp:[60,63],

    say:''}},
  {h:'Why thirds get their own fuss',
   p:['Intervals of three and four semitones matter more than the rest because chords are built by stacking them. Two thirds on top of each other make the three-note chords that the whole of the next module is about.',
      'If you only take one thing from this lesson, take this: three semitones is minor, four is major. You will use that distinction in every chord you ever build.']}

 time:17, chapter:0, module:'Harmony', tag:'Scale steps', lab:'keys',
 opens:'By the end you can build a major scale from any note using one pattern of tones and semitones.',
 blocks:[
  {h:'A scale is a selection',
   p:['You have twelve notes available. Using all of them at once sounds like nothing in particular, so music almost always works from a smaller chosen set. A <b>scale</b> is that set: usually seven of the twelve, in order, starting and ending on the same note.',
      'The note it starts on is the <b>tonic</b>, or home note. Everything else in the scale is heard in relation to it, which is what gives a piece of music a centre of gravity. Play a scale upward and stop on the second-to-last note; you will feel the pull of the note you did not play.']},
  {h:'One pattern, seven notes',
   p:['The <b>major scale</b> is defined entirely by its pattern of steps. Starting from the tonic, go up: tone, tone, semitone, tone, tone, tone, semitone. Written as W for whole step and H for half: <b>W W H W W W H</b>.',
      'That is the whole rule. Apply it from C and you get C D E F G A B C — all the white keys, which is exactly why the keyboard looks the way it does. The two semitone steps land between the third and fourth notes, and between the seventh and the octave.'],

    caption:'C major, numbered 1 to 8. The step pattern above the keys is <b>W W H W W W H</b>. The two half steps (in rust) are 3→4 and 7→8 — precisely the two places on the keyboard where white keys are direct neighbours.'},

    title:'Build a major scale from any note',
    hint:'Change the starting note and watch which keys light up. The step pattern underneath never changes — only where it lands does.',
    say:'Start from C and you get all white keys. Start from F♯ and you get almost all black ones. Same pattern either way.'}},
  {h:'Degrees give the notes jobs',
   p:['Numbering the notes 1 to 7 is more useful than naming them, because the numbers describe a role rather than a pitch. Degree 1 is home. Degree 5, the <b>dominant</b>, is the strongest pull back towards home. Degree 4, the <b>subdominant</b>, is the other main signpost.',
      'Degree 7 is the interesting one: it sits a single semitone below the octave, and that closeness makes it strain upward. Play 1 2 3 4 5 6 7 and stop. The unfinished feeling you get is degree 7 wanting to be degree 8, and composers have been exploiting it for four hundred years.']},
  {h:'The pattern moves; the sound does not',
   p:['Apply W W H W W W H starting from G and you get G A B C D E F♯ G. Six white keys and one black one. It sounds like the same kind of scale as C major — bright, settled, familiar — because the <i>relationships</i> are identical even though every note is different.',
      'This is what makes the step pattern worth memorising rather than the note names. Twelve starting notes, one pattern, twelve major scales.'],
   widget:{kind:'compare',title:'The same scale from two starting notes',
    hint:'Both are major scales. One uses only white keys; the other needs an F♯. They should sound like the same thing at different heights.',
    items:[

      say:'<b>C major</b> — every white key from C to C. The step pattern lands so that no black key is needed, which is why C major is where everybody starts.'},

 title:'Keys, sharps, flats and minor', short:'Move a scale to a new home, and learn the one that sounds sad.',
 time:17, chapter:0, module:'Harmony', tag:'Major & minor', lab:'keys',
 opens:'By the end you can say what key a piece is in, read a key signature, and build a natural minor scale.',
 blocks:[
  {h:'A key is a scale you have committed to',
   p:['When a piece of music draws its notes mainly from one scale and keeps returning to that scale’s home note, the piece is <b>in</b> that <b>key</b>. “In C major” means: these seven notes, with C as home.',
      'Knowing the key is practical, not theoretical. It tells you which notes will sound right, which chords are available, and where the song will want to end. The first question a musician asks when joining a song is what key it is in.']},
  {h:'Every key needs its own black keys',
   p:['Because the step pattern is fixed, moving the home note forces certain notes to be sharpened or flattened. G major needs F♯. D major needs F♯ and C♯. F major needs B♭.',
      'Rather than mark every one of those on every note, written music states them once at the start of a line as a <b>key signature</b>. Two sharps at the top of a page means “every F is F♯ and every C is C♯ until further notice” — which is also a shorthand for “this is D major”.'],
   fig:{kind:'keys',low:67,high:79,kw:36,labels:'all',
    mark:{67:{tone:'orange',text:'1'},69:{tone:'green',text:'2'},71:{tone:'green',text:'3'},72:{tone:'green',text:'4'},74:{tone:'green',text:'5'},76:{tone:'green',text:'6'},78:{tone:'rust',text:'F♯'},79:{tone:'orange',text:'8'}},
    alt:'G major scale on a keyboard from G to G, with F sharp marked in rust as the only black key.',
    caption:'<b>G major</b>. Six white keys and one black: F♯, marked in rust. Without it, the step from degree 7 to 8 would be a whole step instead of the half step the major pattern requires, and the scale would stop sounding major.'}},
  {h:'The minor scale swaps three notes',
   p:['The <b>natural minor</b> scale uses a different step pattern: <b>W H W W H W W</b>. Compared with major, its third, sixth and seventh degrees are each one semitone lower. That flattened third is doing most of the work — you met it in lesson 5 as the sad interval.',
      'Build it from A and you get A B C D E F G A: all white keys again. So A natural minor and C major use exactly the same seven notes, and differ only in which one they treat as home. That relationship has a name — A minor is the <b>relative minor</b> of C major.'],
   widget:{kind:'keys',mode:'scale',low:57,high:81,key:9,scale:'natural minor',
    title:'Major and minor from the same keys',
    hint:'Set the starting note to A with natural minor, then switch to C with major. The lit keys are identical; only the home note moves.',
    say:'Same seven keys, different centre of gravity. Which note you treat as home is what makes music major or minor.'}},
  {h:'Hear the same notes two ways',
   p:['This is worth hearing rather than reading. Both scales below use the white keys only. The first starts and ends on C; the second starts and ends on A. Nothing else changes, and they do not sound remotely alike.'],
   widget:{kind:'compare',title:'C major against A minor',
    hint:'Identical notes, different home. Listen to where each one wants to stop.',
    items:[
     {label:'C major',note:'C D E F G A B C',arp:[60,62,64,65,67,69,71,72],
      say:'<b>C major</b>. The third note, E, sits four semitones above home — a major third — and the whole scale reads as bright.'},
     {label:'A natural minor',note:'A B C D E F G A',arp:[57,59,60,62,64,65,67,69],
      say:'<b>A natural minor</b>. The same seven notes, but home is now A, and the third note, C, is only three semitones above it. One semitone of difference, and the scale has changed mood entirely.'}],
    say:''}},
  {h:'Choosing a key',
   p:['For writing on a keyboard, C major and A minor are the easiest, which is why this course uses them. For singing, the key decides whether a melody sits comfortably in your range or strains at the top — if a song is hard to sing, try moving it down two or three semitones before you rewrite the tune.',
      'Transposing is mechanical: move every note by the same number of semitones and the song is unchanged apart from its height. In a DAW this is a single command, which is one of the genuine advantages of writing music on a computer.']}

 question:'A natural minor and C major contain…', choices:['completely different notes','the same seven notes with a different home note','the same notes but A minor adds a sharp','the same home note'], correct:1,

 title:'Triads', short:'Stack two thirds to make a chord, and move one note to change its mood.',
 time:18, chapter:0, module:'Harmony', tag:'Stacked thirds', lab:'keys',
 opens:'By the end you can build major, minor, diminished and augmented triads from any root, and name the seven chords of a key.',
 blocks:[
  {h:'Three notes, two thirds',
   p:['A <b>chord</b> is several notes sounding at once. The basic one in Western music is the <b>triad</b>: three notes, built by taking a starting note and stacking two thirds on top of it.',
      'The starting note is the <b>root</b>, and it names the chord. From the root, go up a third to get the <b>third</b> of the chord, then up another third for the <b>fifth</b>. You met both intervals in lesson 5, and now they have jobs.'],
   fig:{kind:'keys',low:60,high:72,kw:36,labels:'all',
    mark:{60:{tone:'orange',text:'root'},64:{tone:'green',text:'3rd'},67:{tone:'blue',text:'5th'}},
    spans:[{from:60,to:64,text:'major third · 4'},{from:64,to:67,text:'minor third · 3'}],
    alt:'A C major triad on a keyboard: C marked as root, E as third, G as fifth, with the two stacked thirds bracketed.',
    caption:'<b>C major</b>: C, E, G. A major third (4 semitones) from C to E, then a minor third (3) from E to G. Major third on the bottom, minor on top — that order is what makes a triad major.'},
   widget:{kind:'keys',mode:'chord',low:60,high:84,root:60,quality:'major',
    title:'Build any triad',
    hint:'Choose a root and a quality and the keys light up by their job in the stack: root, third, fifth. Press play to hear it.',
    say:'Change the quality and watch which single key moves.'}},
  {h:'One semitone decides major or minor',
   p:['Swap the order of the two thirds and the chord changes character completely. Minor third on the bottom, major third on top, and you have a <b>minor triad</b>. In practice this means one thing: lower the middle note by a semitone.',
      'C major is C E G. C minor is C E♭ G. The root and fifth do not move at all. Everything you hear as the difference between a happy chord and a sad one is that one key.'],
   widget:{kind:'compare',title:'Major against minor, one note apart',
    hint:'Both chords keep C at the bottom and G on top. Only the middle note moves, by one semitone.',
    items:[
     {label:'C major',note:'C E G · 4 then 3',notes:[60,64,67],
      say:'<b>C major</b> — C, E, G. The major third on the bottom gives it the bright, settled quality.'},
     {label:'C minor',note:'C E♭ G · 3 then 4',notes:[60,63,67],
      say:'<b>C minor</b> — C, E♭, G. The middle note has dropped one key. Same root, same fifth, and an entirely different feeling.'}],
    say:''}},
  {h:'Two more triads, used sparingly',
   p:['Stack two minor thirds and you get a <b>diminished</b> triad (C E♭ G♭): cramped and unstable, used to create tension that has to resolve. Stack two major thirds for an <b>augmented</b> triad (C E G♯): strange and floating, used far less often.',
      'You will not need these two often, but they complete the set. All four triads are just the two possible thirds arranged in the four possible ways.']},
  {h:'Every scale degree gets a chord',
   p:['Here is where scales and chords meet. Take C major, build a triad on each of its seven degrees using only notes from the scale, and you get seven chords — no choices involved, just the scale applied mechanically.',
      'The result is a fixed pattern that holds in every major key: degrees 1, 4 and 5 give major chords; 2, 3 and 6 give minor chords; and 7 gives a diminished one. Those are written as roman numerals, capitals for major and lower case for minor: <b>I ii iii IV V vi vii°</b>. Those seven chords are the raw material of the next lesson.'],
   fig:{kind:'grid',beats:7,div:1,cw:52,laneWidth:74,counts:['I','ii','iii','IV','V','vi','vii°'],
    lanes:[
     {name:'Chord',tone:'green',on:[0,3,4],text:{0:'C',1:'Dm',2:'Em',3:'F',4:'G',5:'Am',6:'Bdim'}},
     {name:'Quality',tone:'soft',on:[1,2,5],text:{0:'major',1:'minor',2:'minor',3:'major',4:'major',5:'minor',6:'dim'}}],
    alt:'The seven triads of C major with their roman numerals, showing which are major, minor and diminished.',
    caption:'The seven chords of C major. Filled cells in the top row are the three <b>major</b> chords — I, IV and V. The filled cells below mark the three <b>minor</b> ones, ii, iii and vi. Degree 7 gives the lone diminished chord.'}}

 title:'Inversions and voicing', short:'Keep the same three notes but change which one is at the bottom.',
 time:16, chapter:0, module:'Harmony', tag:'Rearranging', lab:'keys',
 opens:'By the end you can play a chord in three positions and choose the one that moves least from the chord before it.',
 blocks:[
  {h:'A chord is a set, not an order',
   p:['C major is C, E and G. It is still C major if you play E, G and C, or G, C and E. The notes are the same; only their arrangement differs. These rearrangements are called <b>inversions</b>, and they are named by which note ends up lowest.',
      '<b>Root position</b> has the root at the bottom (C E G). <b>First inversion</b> moves the root up an octave, putting the third at the bottom (E G C). <b>Second inversion</b> moves the third up too, so the fifth is lowest (G C E). The chord keeps its name throughout — it is a C chord because C is its root, not because C is its lowest note.'],
   fig:{kind:'keys',low:60,high:84,kw:26,labels:'c',
    mark:{60:{tone:'orange',text:'C'},64:{tone:'green',text:'E'},67:{tone:'blue',text:'G'},
          72:{tone:'orange',text:'C'},76:{tone:'green',text:'E'},79:{tone:'blue',text:'G'}},
    alt:'Two octaves with C, E and G marked in both, showing that the same three note names make the chord wherever they sit.',
    caption:'The same three note names, twice over. Any combination of C, E and G is a C major chord — the colours show that it is the <i>names</i> that matter, not the register. Which one you put at the bottom is what gives the chord its inversion.'},
   widget:{kind:'keys',mode:'chord',low:60,high:84,root:60,quality:'major',
    title:'Turn a chord over',
    hint:'Press the inversion buttons. The lowest note changes; the chord’s name does not. Keep the tint colours in view — the third stays the third wherever it moves.',
    say:'Three positions, one chord.'}},
  {h:'Why bother? Because hands move less',
   p:['Inversions exist for a practical reason. Playing C major then F major in root position means jumping your whole hand up the keyboard. But C major is C E G and F major is F A C — they share a C. Put F in second inversion as C F A and your hand barely moves.',
      'Choosing inversions so that voices move as little as possible is called <b>voice leading</b>, and it is most of what separates chords that sound like a sequence of stabs from chords that sound like music. The rule of thumb is simple: keep common notes where they are and move everything else the shortest distance available.'],
   widget:{kind:'compare',title:'The same two chords, moved two ways',
    hint:'Both buttons play C major then F major. The first jumps; the second keeps the shared C in place.',
    items:[
     {label:'Both in root position',note:'C E G → F A C',arp:[60,64,67,65,69,72],hold:1.4,
      say:'<b>Root position throughout.</b> Every note has moved, and the hand has jumped up the keyboard. It sounds like two separate events.'},
     {label:'F in second inversion',note:'C E G → C F A',arp:[60,64,67,60,65,69],hold:1.4,
      say:'<b>F inverted.</b> The C stays exactly where it was and the other two notes step up slightly. Same two chords, and now it sounds like one thing turning into another.'}],
    say:''}},
  {h:'Spacing, doubling and leaving notes out',
   p:['<b>Voicing</b> is the wider question of how you spread a chord out. The same triad can be three notes under one hand or six notes across two, with the root doubled an octave down and the fifth left out entirely.',
      'Two practical habits. Keep the lower notes further apart than the upper ones — close intervals low down turn to mud. And if a chord sounds cluttered, the fifth is almost always the note to drop; the root and third carry the chord’s identity, and the fifth is mostly reinforcement.']},
  {h:'When the bass note gets its own name',
   p:['In a full arrangement, the lowest note usually comes from the bass instrument rather than the chord instrument, and it decides what the chord sounds like it is sitting on. That is why chord charts sometimes write a slash: <b>C/E</b> means a C major chord with E in the bass.',
      'You will use this most often to make a bass line walk smoothly underneath chords that are not moving smoothly themselves — the chords stay put, the bass note steps, and the progression gains a sense of direction it did not have.']}
 ],

 title:'Progressions and cadences', short:'Put chords in an order that goes somewhere and knows how to stop.',
 time:18, chapter:0, module:'Harmony', tag:'Four chords', lab:'keys',
 opens:'By the end you can build a four-chord loop, say why it works in roman numerals, and end a phrase on purpose.',
 blocks:[
  {h:'Chords in a sequence',
   p:['A <b>chord progression</b> is chords played one after another, usually one or two bars each. It is the skeleton of almost every song: melody and lyrics are written over it, and the arrangement is built around it.',
      'Progressions are written in roman numerals rather than letters, because the numerals describe the <i>shape</i> of the progression independently of key. I–V–vi–IV is C–G–Am–F in C major and G–D–Em–C in G major. Same progression, same feeling, different pitches.'],
   fig:{kind:'timeline',bars:8,bw:44,laneWidth:78,
    sections:[{from:1,to:4,name:'First time',tone:'soft'},{from:5,to:8,name:'Repeat',tone:'pale'}],
    lanes:[{name:'Chord',tone:'green',spans:[
      {from:1,to:1,label:'C'},{from:2,to:2,label:'G',tone:'blue'},{from:3,to:3,label:'Am',tone:'orange'},{from:4,to:4,label:'F',tone:'slate'},
      {from:5,to:5,label:'C'},{from:6,to:6,label:'G',tone:'blue'},{from:7,to:7,label:'Am',tone:'orange'},{from:8,to:8,label:'F',tone:'slate'}]},
     {name:'Degree',tone:'pale',spans:[
      {from:1,to:1,label:'I'},{from:2,to:2,label:'V'},{from:3,to:3,label:'vi'},{from:4,to:4,label:'IV'},
      {from:5,to:5,label:'I'},{from:6,to:6,label:'V'},{from:7,to:7,label:'vi'},{from:8,to:8,label:'IV'}]}],
    alt:'Eight bars showing the chord loop C G Am F played twice, with roman numerals I V vi IV beneath.',
    caption:'<b>I–V–vi–IV</b> in C major, one chord a bar, played round twice. This is the loop used by a conspicuous number of hit records. Because the last chord does not resolve, it hands you straight back to the first.'},
   widget:{kind:'chords',slots:[0,4,5,3],tempo:88,
    title:'Build your own progression',
    hint:'Four bars, one chord each, chosen from the seven chords of C major. Change any slot and play the loop.',
    say:'I – V – vi – IV. Press play, then try putting a different chord in the last bar.'}},
  {h:'Why that loop works',
   p:['Three things are going on. First, it starts at home (I) and leaves immediately for the strongest possible contrast (V). Second, vi is the relative minor, so bar three brings a shade of sadness without leaving the key. Third — and this is the clever part — IV at the end does not resolve.',
      'Degree 4 pulls towards degree 1 much more weakly than degree 5 does. Ending on IV leaves the loop slightly ajar, so returning to I feels natural rather than repetitive. That is why you can listen to this progression forty times in a row.']},
  {h:'Cadences: how a phrase stops',
   p:['A <b>cadence</b> is the chord move that ends a phrase, and it decides whether the music sounds finished. The strongest is <b>V–I</b>, the <b>perfect cadence</b>: degree 7 inside the V chord strains upward into the tonic, and arriving feels like a door closing. Almost every classical piece ends this way, and so does most pop.',
      'The alternatives do different jobs. <b>IV–I</b> (plagal) closes gently rather than firmly — the “amen” ending. Stopping <i>on</i> V is a <b>half cadence</b>: unfinished on purpose, which is what you want at the end of a verse that leads into a chorus. And <b>V–vi</b>, the interrupted cadence, promises resolution and then withholds it.'],
   widget:{kind:'compare',title:'Four ways to end the same phrase',
    hint:'Each one plays the two final chords of a phrase in C major. Listen for whether you could stop there.',
    items:[
     {label:'V – I · perfect',note:'G then C',arp:[67,71,74,60,64,67],hold:1.5,
      say:'<b>Perfect cadence.</b> The B inside the G chord rises a semitone into C. Completely finished — there is nothing left to say.'},
     {label:'IV – I · plagal',note:'F then C',arp:[65,69,72,60,64,67],hold:1.5,
      say:'<b>Plagal cadence.</b> Also finished, but it settles rather than lands. Hymns and a lot of soft rock end here.'},
     {label:'I – V · half',note:'C then G',arp:[60,64,67,67,71,74],hold:1.5,
      say:'<b>Half cadence.</b> Stopping on V leaves the phrase hanging mid-sentence. Perfect for the end of a verse, hopeless as the end of a song.'},
     {label:'V – vi · interrupted',note:'G then Am',arp:[67,71,74,69,72,76],hold:1.5,
      say:'<b>Interrupted cadence.</b> Everything sets up a return to C and then arrives on A minor instead. It is a small, reliable heartbreak.'}],
    say:''}},
  {h:'Loops and progressions that travel',
   p:['Most modern songwriting uses loops: four chords that come round and round while the melody and arrangement change above them. The chords are a stage, not a story.',

 title:'Melody and motif', short:'Write a short phrase someone could sing back to you.',

  {h:'A melody is a shape in time',

  {h:'A motif is a cell you reuse',
   p:['Almost no memorable melody is eight different ideas in a row. It is one short idea — a <b>motif</b> of three or four notes — stated, then repeated with changes. Repetition is what makes a tune stick; variation is what stops it being boring.',
      'Three standard variations cover most of what you need. <b>Transposition</b> plays the same shape starting on a different note. <b>Inversion</b> turns it upside down, so rises become falls. <b>Augmentation</b> plays it slower. All three keep the shape recognisable while making the second statement different from the first.']},
  {h:'Steps are easy, leaps are expensive',
   p:['Moving to a neighbouring scale note is a <b>step</b>; moving further is a <b>leap</b>. Steps are easy to sing and easy to follow, so most melodies are mainly steps, with a few leaps placed where they will be noticed.',
      'Two guidelines that will serve you for years. Keep the whole phrase inside about an octave, or singers will struggle at one end. And after a big leap, come back by step — a leap up followed by a stepwise descent is one of the most satisfying shapes in music, and it is exactly what the figure above does in bars 3 and 4.']},

   p:['Melody and chords have to agree. A note that belongs to the chord underneath it — a <b>chord tone</b> — sounds settled. A note that is in the key but not in the chord — a <b>passing note</b> — sounds like motion, and is fine as long as it moves on quickly.',
      'The practical method: land on chord tones at the start of each bar and on long notes, and use anything else in the scale to get between them. If a long note sounds wrong, it is almost always because it is not in the chord beneath it, and moving it one step will fix it.'],

 time:18, chapter:1, module:'Groove', tag:'Groove layers', lab:'beat',
 opens:'By the end you can build a groove where each instrument has one job, and lock a bass line to the kick.',

  {h:'The rhythm section is a division of labour',
   p:['A groove is not one rhythm — it is three or four simple rhythms that agree with each other. Each instrument takes one job and stays out of the others’ way. That is the whole trick, and it is why a four-piece pattern made of trivially simple parts sounds better than one clever part doing everything.',
      'The standard division: the kick marks the structure, the snare marks the backbeat, the hi-hat keeps the subdivision ticking, and the <b>bass</b> connects the drums to the harmony. Four parts, four jobs.'],

  {h:'Lock the bass to the kick',
   p:['The single most effective thing you can do for a groove is put the bass notes on the same positions as the kick drum. Low frequencies take time to develop, and two low sounds arriving a fraction apart turn to mush. On the same position they reinforce each other and the bottom end gets solid.',
      'Once the pattern is locked you can loosen it deliberately. A bass note that arrives slightly before the kick pushes the groove; one that lands slightly after relaxes it. But learn the locked version first, because you cannot break a rule you have not yet heard working.'],

    say:'The bottom lane stands in for the bass. Keep it on the same columns as the kick and the groove feels planted.'}},
  {h:'Space is an instrument',
   p:['Beginners fill every position; the pattern gets busy and stops grooving. Almost every great drum part has large empty areas, and the empty areas are what make the hits land.',
      'A reliable exercise: take a pattern you like and remove a third of its hits. Nine times out of ten it improves. If you cannot decide what to cut, cut hi-hats first — they are the easiest layer to over-fill and the least missed.']},
  {h:'Where the bass notes come from',
   p:['Rhythm is half the bass line; the other half is which notes. The default is the root of whatever chord is playing — in bar one of a C chord, play C. It is unglamorous and it always works, because it tells the listener what the harmony is.',
      'Two upgrades once the roots are solid. Play the fifth as well as the root for movement inside a bar. And on the last beat before a chord change, step towards the next root rather than repeating the current one: a <b>walk-up</b> or <b>walk-down</b> of one or two scale steps. That single moving note is what makes a bass line sound played rather than programmed.'],

 title:'Phrasing and lyrics', short:'Fit words to the beat, or shape an instrumental hook that breathes.',
 time:19, chapter:1, module:'Words', tag:'Word stress', lab:'beat',
 opens:'By the end you can place a line of words so its natural stresses land on strong beats, and leave room to breathe.',
 blocks:[
  {h:'Words already have a rhythm',
   p:['Every word in English has a built-in stress pattern. “Window” is WIN-dow, never win-DOW. Phrases inherit it: “the window seat” has its weight on WIN. When you set words to music you are not inventing a rhythm, you are finding the one the words already have and lining it up with the beat.',
      'The failure mode is unmistakable. Put a stressed syllable on a weak beat and the line sounds like a robot reading a shopping list. Singers then fight the melody to make it sound natural, which is a problem you created and they have to solve.']},
  {h:'Stressed syllables on strong beats',
   p:['The rule is almost mechanical: stressed syllables go on beats 1 and 3, and anything unstressed fills the spaces between. Say your line out loud, exaggerating its natural stresses, and write down where the weight falls. That is your rhythm before you write a single note.',
      'The grid below shows a four-syllable line placed well. Say it along with the figure, then imagine “seat” arriving on an “and” instead and hear how wrong it becomes.'],
   fig:{kind:'grid',beats:4,div:2,cw:42,laneWidth:92,
    lanes:[
     {name:'Syllables',tone:'orange',on:[0,2,4,6],text:{0:'WIN',2:'dow',4:'SEAT',6:'—'}},
     {name:'Stress',tone:'green',on:[0,4],text:{0:'strong',4:'strong'}},
     {name:'Snare',tone:'blue',on:[2,6]}],
    alt:'A bar showing the syllables WIN-dow-SEAT placed on beats 1, 2 and 3, with the stressed syllables on beats 1 and 3 and beat 4 left empty.',
    caption:'“<b>WIN</b>-dow <b>SEAT</b>” across one bar. The two stressed syllables land on beats 1 and 3, the strong beats. Beat 4 is deliberately empty — that gap is where the singer breathes and where the listener catches up.'},
   widget:{kind:'steps',beats:4,div:2,tempo:84,min:60,max:120,
    title:'Place a line on the beat',
    hint:'Each lane is one syllable of “WIN-dow SEAT”. Move the stressed ones off beats 1 and 3 and hear the line stop sounding like English.',
    lanes:[
     {name:'WIN (strong)',id:'kick',on:[0]},
     {name:'dow (weak)',id:'hat',on:[2],level:.5},
     {name:'SEAT (strong)',id:'kick',on:[4]},
     {name:'Snare',id:'snare',on:[2,6],level:.6}],
    say:'Say the words out loud with it. When a strong syllable sits on an “&”, you will hear the line trip.'}},
  {h:'Leave the last beat alone',
   p:['A four-bar phrase that fills every beat has nowhere to breathe. Singers need air and listeners need a gap to process what they just heard. The simplest fix in songwriting is to end each two-bar phrase a beat early.',
      'This is also where <b>call and response</b> comes from: a vocal line for two bars, then two bars of instrumental answer. The gap is not wasted space, it is the other half of the conversation.']},
  {h:'Rhyme marks the structure',
   p:['Rhyme is not decoration — it tells the listener where the lines end, which is how they hear the shape of a verse without being told. The common schemes are AABB (couplets: punchy, simple) and ABAB (alternating: more flowing). Pick one and stay with it inside a section, or the structure stops being audible.',
      'Two things matter more than finding a perfect rhyme. Keep line lengths consistent, so each one occupies the same number of bars. And put your best image at the end of a line, where the rhyme draws attention to it.']},
  {h:'If there are no words',
   p:['Instrumental hooks follow exactly the same rules, with the stresses coming from note length and register instead of syllables. A long note or a high note functions as a stressed syllable, so put those on strong beats.',
      'And treat the hook as if it had to be sung even when it does not. Leave gaps where a singer would breathe. A melody that never rests is tiring whether or not anyone has to perform it.'],
   fig:{kind:'grid',beats:4,div:2,cw:42,laneWidth:92,
    lanes:[

    caption:'<b>Call and response.</b> The hook states three notes and stops on beat 4. Two bars later the answer replies with the same rhythm and a falling shape. Neither line fills its bar, and the song is easier to follow for it.'}}

},{
 title:'Song form and arrangement', short:'Turn a repeating loop into sections that arrive, build and end.',
 time:20, chapter:1, module:'Form', tag:'Sixteen bars', lab:'project',
 opens:'By the end you can lay out a sixteen-bar song in sections and decide which parts play in each one.',
 blocks:[
  {h:'Form is the plan; arrangement is what plays',
   p:['Two separate decisions, often confused. <b>Form</b> is the order and length of the sections: intro, verse, chorus, verse, chorus, bridge, chorus. <b>Arrangement</b> is which instruments play in each of those sections, and how densely.',
      'You can keep one chord loop running for an entire song and still have a song that goes somewhere, purely through arrangement. That is how an enormous amount of modern music works, and it is the most efficient skill in this chapter: the chords stay put, the <i>layers</i> tell the story.']},
  {h:'Sections in multiples of four',
   p:['Sections are almost always four, eight or sixteen bars long, because listeners count in fours without noticing and a section that breaks the pattern feels like a mistake rather than a surprise.',
      'This course builds a sixteen-bar song in four four-bar sections: an intro, a verse, a hook, and an outro. Sixteen bars at 96 BPM is forty seconds — short, but a complete piece of music with a beginning and an end, which is far more useful as a first finished thing than three minutes of unfinished one.'],
   fig:{kind:'timeline',bars:16,bw:30,laneWidth:84,
    sections:[{from:1,to:4,name:'Intro',sub:'bars 1–4',tone:'pale'},{from:5,to:8,name:'Verse',sub:'bars 5–8',tone:'soft'},
              {from:9,to:12,name:'Hook',sub:'bars 9–12',tone:'orange'},{from:13,to:16,name:'Outro',sub:'bars 13–16',tone:'slate'}],
    lanes:[
     {name:'Chords',tone:'green',spans:[{from:1,to:16,label:'C · G · Am · F, round and round'}]},
     {name:'Drums',tone:'blue',spans:[{from:5,to:12,label:'enters at bar 5'}]},
     {name:'Bass',tone:'slate',spans:[{from:5,to:12,label:'with the drums'}]},
     {name:'Lead',tone:'orange',spans:[{from:9,to:12,label:'hook only'}]}],
    marks:[{at:9,label:'hook enters'}],
    alt:'A sixteen-bar arrangement in four sections. Chords run throughout; drums and bass enter at bar 5; the lead plays only bars 9 to 12.',
    caption:'The whole song on one page. The chord loop never changes across all sixteen bars. Everything you hear as structure comes from <b>entrances</b>: drums and bass arrive at bar 5, the lead arrives at bar 9, and both leave for the outro. The dashed line is the moment the song is about.'},
   widget:{kind:'arrange',tempo:96,sections:['Intro','Verse','Hook','Outro'],
    on:[[false,true,true,false],[false,true,true,false],[true,true,true,true],[false,false,true,false]],
    title:'Arrange the sixteen bars yourself',
    hint:'Rows are layers, columns are four-bar sections. Press play for the whole song, then take the drums out of the hook and listen to what that costs.',
    say:'Four sections, four layers. Everything that makes this sound like a song rather than a loop is in this grid.'}},
  {h:'Build by addition, not by volume',
   p:['The instinct when a section needs to feel bigger is to turn things up. That almost never works, because loud and dense are different things and listeners respond to density.',
      'Add a layer instead. The hook in the arrangement above feels like an arrival because two things happen at bar 9: the lead enters, and the hi-hats double from quarters to eighths. Nothing got louder. There is simply more going on, and more going on reads as bigger.']},
  {h:'Taking things away is the other half',
   p:['An entrance only works if something was absent before it. That means planning your <i>removals</i> as deliberately as your additions. The intro has no drums so that bar 5 can land; the outro drops the lead so the song can finish rather than stop.',
      'The most reliable trick in arranging is the one-bar drop: take everything out except one layer for a single bar just before a chorus. The silence makes the next entrance feel twice its size, and it costs you nothing.']},
  {h:'How sections are usually ordered',
   p:['Beyond sixteen bars, the common forms are worth knowing. <b>Verse–chorus</b> alternates a changing story with a repeating payoff. <b>AABA</b> states an idea twice, departs, and returns — standard in jazz and older songwriting. <b>Verse–prechorus–chorus</b> adds a short ramp whose only job is to make the chorus feel inevitable.',
      'Whichever you use, the chorus should be the densest, highest and most repetitive part of the song. If your verse is busier than your chorus, the song will feel like it is going backwards.']}

 title:'Recording a take', short:'Set the project tempo, record against a click, and keep the take you want.',
 time:18, chapter:2, module:'Recording', tag:'Takes & click', lab:'garageband',
 opens:'By the end you can set a project up correctly, record several takes of the same part, and choose between them.',
 blocks:[
  {h:'Set the tempo before you record anything',
   p:['A recording program keeps a grid of bars and beats, and everything you record is stamped against it. Set the <b>project tempo</b> first, because the grid is what makes everything later possible: looping a section, quantising a sloppy take, lining the bass up with the kick.',
      'Get this wrong and MIDI will survive — it is just note numbers and positions, so it can be stretched to a new tempo without harm. Audio will not. Changing the tempo after recording audio either leaves it out of time or forces time-stretching, which costs sound quality. One minute of deciding saves an hour of repair.']},
  {h:'The click is a tool, not a judgement',
   p:['The <b>metronome</b>, or <b>click track</b>, plays the pulse while you record. New musicians dislike it because it makes their timing audible. That is exactly what it is for.',
      'Three habits make it much easier. Have it play two bars before recording starts — a <b>count-in</b> — so you arrive already in time rather than guessing at bar 1. Make it loud enough that you are not straining to hear it. And if you keep fighting it, you are probably playing too fast: drop five BPM and it will usually come right.'],
   widget:{kind:'tap',tempo:96,title:'Record against a click',
    hint:'This is the same exercise as lesson 1, now with a number attached. Press start, tap on every click, and watch the scatter. Under 40 ms is tighter than any listener will notice.',
    say:'Being consistently a little late is barely audible. Drifting — where the taps walk steadily across the strip — is what people hear as bad timing.'}},
  {h:'Levels: aim low, not loud',
   p:['Each track has an input level and a meter. The one rule is: never let it reach the top. Digital audio has a hard ceiling, and a signal that exceeds it is <b>clipped</b> — the peaks are cut flat and the result is a permanent crunch that no amount of later work removes.',
      'Aim for the loudest moment of your performance to peak around two-thirds up the meter. That looks quiet, and it is meant to. Headroom is free, and you will make the whole thing louder in one step at the very end.'],
   fig:{kind:'meters',track:290,laneWidth:116,
    rows:[
     {name:'Too hot',value:99,tone:'rust',label:'clipped',note:'ruined — re-record it'},
     {name:'Good',value:68,tone:'green',label:'−12 dB',note:'plenty of headroom'},
     {name:'Too quiet',value:17,tone:'slate',label:'−40 dB',note:'noise comes up with it'}],
    alt:'Three input meters: one clipped at the top, one at about two-thirds, and one very low.',
    caption:'Three input levels. The top one has hit the ceiling and is <b>clipped</b> — that damage is baked into the file. The middle one peaks around two thirds, which is the target. The bottom one is so quiet that raising it later will raise the room noise with it.'}},
  {h:'Record it several times',
   p:['Professional recording is mostly repetition. Record the same part three or four times rather than trying to nail it once; each pass is a <b>take</b>, and programs keep them stacked so you can audition and switch between them.',
      'Two things you will notice. Takes two and three are nearly always better than take one, because by then you have stopped thinking about the equipment. And the take that felt worst while you were playing is quite often the best one on playback, because feel and sound are different things. Judge by listening, never by memory.']},
  {h:'Record parts one at a time',
   p:['Build up in layers: chords first, because they define the harmony and the timing of everything else; then bass, locked to the kick; then drums or a programmed beat; then the lead on top. This is <b>overdubbing</b>, and it is why one person can make a record.',
      'Record each part on its own track. It is tempting to bounce things together to keep the window tidy, but separate tracks are what let you fix one part without touching the others — which is the subject of the next lesson.']}

 title:'Editing regions and timing', short:'Trim what you captured, repair a timing slip, and loop what works.',
 time:19, chapter:2, module:'Editing', tag:'Regions & edits', lab:'garageband',
 opens:'By the end you can trim, copy and loop a region, and fix a late note without re-recording the part.',
 blocks:[
  {h:'Everything you record becomes a region',
   p:['A recording arrives in the timeline as a <b>region</b>: a block on a track with a start, an end and some contents. Editing is almost entirely the manipulation of these blocks, and the four operations below cover most of what you will ever do.',
      '<b>Trim</b> drags an edge inward to shorten it. <b>Split</b> cuts one region into two at the playhead. <b>Move</b> drags it in time. <b>Loop</b> repeats it. None of these change the recording itself — they change which part of it plays and when, which is why editing is safe to experiment with.'],
   fig:{kind:'timeline',bars:8,bw:40,laneWidth:96,
    lanes:[
     {name:'Chords',tone:'green',spans:[{from:1,to:4,label:'take 2 · kept'},{from:5,to:8,label:'looped copy',tone:'pale'}]},
     {name:'Bass',tone:'slate',spans:[{from:1,to:2,label:'good'},{from:3,to:3,label:'bad',tone:'rust'},{from:4,to:8,label:'good'}]},

    marks:[{at:3,label:'split, replace bar 3'}],
    alt:'Three tracks of regions over eight bars, with a four-bar chord region looped, one bad bass bar marked in rust, and a lead entering at bar five.',
    caption:'Three tracks of regions. The chord take runs four bars and is <b>looped</b> to fill eight. The bass has one bad bar, marked in rust: rather than re-record the lot, <b>split</b> either side of bar 3 and replace just that bar. The lead is trimmed to start at bar 5.'}},
  {h:'Trim silence off the front',
   p:['A recorded region normally starts a little before the first note and ends a little after the last. Drag the left edge up to just before the first sound and the right edge to just after the last one. This is tidy housekeeping, but it also removes handling noise and keeps the arrangement readable.',
      'Leave a few milliseconds of margin. Trimming exactly onto the first sample of a note shaves the attack, which makes a soft entrance sound clipped.']},
  {h:'Quantising, and why not to use all of it',
   p:['<b>Quantising</b> snaps recorded notes onto the nearest grid position. On MIDI it is close to magic: a scrappy part becomes exactly in time in one command. On a sloppy hi-hat pattern it is the right answer almost every time.',
      'Full quantise on a performance, though, removes the small timing variations that make it sound human, and the result is stiff. Most programs offer a strength or percentage: at 50% the notes move halfway to the grid, which fixes the obvious mistakes and keeps the feel. Quantise drums hard, keyboards gently, and lead lines barely at all.'],
   widget:{kind:'compare',title:'The same bar, three amounts of correction',
    hint:'One drum bar: as played, half-corrected, and snapped exactly to the grid. Listen for where it stops sounding sloppy and starts sounding mechanical.',
    items:[
     {label:'As played',note:'hits up to 90 ms off',tempo:96,
      hits:[{id:'kick',at:0.04},{id:'hat',at:0.52},{id:'snare',at:1.09},{id:'hat',at:1.47},{id:'kick',at:1.94},{id:'hat',at:2.56},{id:'snare',at:3.08},{id:'hat',at:3.44}],
      say:'<b>As played.</b> The snares are late and the hats are uneven. You can hear it as untidiness rather than as feel.'},
     {label:'Quantised 50%',note:'halfway to the grid',tempo:96,
      hits:[{id:'kick',at:0.02},{id:'hat',at:0.51},{id:'snare',at:1.04},{id:'hat',at:1.48},{id:'kick',at:1.97},{id:'hat',at:2.53},{id:'snare',at:3.04},{id:'hat',at:3.47}],
      say:'<b>Half strength.</b> The errors are halved, so nothing sounds like a mistake, but the hits are still not identical. This is usually the one to keep.'},
     {label:'Quantised 100%',note:'exactly on the grid',tempo:96,
      hits:[{id:'kick',at:0},{id:'hat',at:0.5},{id:'snare',at:1},{id:'hat',at:1.5},{id:'kick',at:2},{id:'hat',at:2.5},{id:'snare',at:3},{id:'hat',at:3.5}],
      say:'<b>Full strength.</b> Perfectly in time, and noticeably mechanical. Right for programmed drums and dance music, wrong for anything meant to sound played.'}],
    say:''}},
  {h:'Fix one bar, not the whole part',
   p:['When a single moment is wrong, the beginner’s instinct is to record the whole part again. Don’t. Split the region either side of the problem, delete the middle, and record just that gap — a <b>punch-in</b>. Or copy a good bar from elsewhere in the same part and paste it over the bad one, which costs nothing and is undetectable if the part repeats.',
      'A caution with copy-and-paste: a part made of identical bars sounds identical, because it is. If you paste the same bar eight times, change something small in two or three of them.']},
  {h:'Fades stop the clicks',
   p:['Cutting audio anywhere other than silence can leave a click, because the waveform is chopped mid-cycle. A very short <b>fade-in</b> and <b>fade-out</b> on each region edge — a handful of milliseconds, inaudible as a fade — removes it.',
      'Most programs can apply these automatically. If an edit sounds like it has a tiny tick at the join, this is why, and it is a two-second fix rather than a re-record.']}

 title:'Mixing: level, pan and space', short:'Make every part audible by giving each one its own place.',
 time:20, chapter:2, module:'Mixing', tag:'Mix levels', lab:'garageband',
 opens:'By the end you can balance four parts so the lead is clear without being loud, using level, pan, EQ and reverb.',
 blocks:[
  {h:'Mixing is about audibility, not volume',
   p:['<b>Mixing</b> is the process of making a collection of recorded parts sound like one piece of music. The common misunderstanding is that it means making things louder. It means making things <i>audible</i>, which is usually achieved by turning other things down.',
      'There is only so much room in a mix. Every part you add takes space from the others, so the real question is never “how do I hear the lead?” but “what is covering it?”. Three of the four tools below work by getting something out of the way.']},
  {h:'Level: set the loudest thing first',
   p:['Start with every fader down, bring up the most important part — usually the lead or the vocal — and set everything else relative to it. That sounds backwards and it is the fastest route to a balance that works.',
      'Then use the mute button as a diagnostic. If muting a part makes no difference, it is not earning its place. If muting it makes the mix suddenly clear, you have found the thing that was in the way.'],
   fig:{kind:'meters',track:270,laneWidth:96,
    rows:[

    alt:'Four mix faders with the lead loudest, the chords pulled down from a dashed earlier position, and bass and drums steady.',
    caption:'Four parts balanced against each other. The lead is set first and becomes the reference. The dashed outline shows where the <b>chords</b> were before they came down six decibels — the lead became clear without the lead moving at all.'},
   widget:{kind:'mix',tempo:96,
    tracks:[{name:'Drums',role:'drums',level:66,pan:0},{name:'Bass',role:'bass',level:72,pan:0},
            {name:'Chords',role:'chords',level:54,pan:-34},{name:'Lead',role:'lead',level:82,pan:22}],
    title:'Balance a four-part mix',
    hint:'Press play and change faders while it loops. Pull the chords up to 90 and listen to the lead disappear without ever being turned down.',
    say:'Mute each part in turn by dragging its level to zero. The one you miss least is the one to pull down when the mix gets crowded.'}},
  {h:'Pan: stereo is a second dimension',
   p:['<b>Panning</b> places a part between the left and right speakers. It is the cheapest fix in mixing, because two parts in the same spot compete and the same two parts a little apart both become clear without either changing level.',
      'The conventions are worth following. Kick, bass and lead vocal go in the centre, because they carry the most energy and should arrive equally in both ears. Everything else can be spread: rhythm guitars and keyboards left and right, hi-hats slightly off-centre, backing vocals wide. Keep it modest — fully hard left sounds like a mistake on headphones.']},
  {h:'EQ: make room by frequency',
   p:['<b>EQ</b> (equalisation) turns particular frequency ranges up or down within a single part. Used well, it is the third kind of space: two parts can occupy the same position and the same volume and still both be audible if they are not fighting over the same frequencies.',
      'Beginners reach for EQ to boost. Experienced engineers mostly cut. If the vocal is unclear, find the range where the guitars are crowding it and reduce it <i>in the guitars</i>; the vocal becomes clear and the mix does not get louder. The one boost worth making habitually is a <b>high-pass filter</b> on everything except kick and bass, removing rumble below about 80 Hz that nothing musical lives in.'],
   widget:{kind:'compare',title:'The same chord, three tonal shapes',
    hint:'One chord, filtered three ways. The notes are identical; only which frequencies survive is different.',
    items:[
     {label:'Full range',note:'no filtering',notes:[60,64,67],hold:1.9,level:.2,
      say:'<b>Full range.</b> Everything present. In a crowded mix this is the version that covers other parts.'},
     {label:'Darkened',note:'highs cut',notes:[60,64,67],hold:1.9,level:.2,cutoff:700,
      say:'<b>Highs cut.</b> Still clearly the same chord, but it has moved behind everything else. This is how you keep a part in a mix without it competing.'},
     {label:'Thinned',note:'lows cut',notes:[72,76,79],hold:1.9,level:.17,
      say:'<b>Lows cut.</b> Now it sits above the bass instead of on top of it. Two parts can share a mix easily once they stop sharing a frequency range.'}],
    say:''}},
  {h:'Reverb: depth, used sparingly',
   p:['<b>Reverb</b> adds the sound of a room, which places a part further away. A little makes a dry recording sound like it exists somewhere; a lot pushes it to the back of a hall and takes its definition with it.',
      'Use it as a dimension rather than an effect: keep the lead fairly dry so it stays close, and put more on parts you want behind it. One shared reverb for the whole mix makes everything sound like it is in the same room, which is usually the goal.'],

    hint:'The same four notes, close and then further away.',
    items:[
     {label:'Dry',note:'no reverb',arp:[64,67,69,67],
      say:'<b>Dry.</b> Right in front of you. Clear, and slightly bare on its own.'},
     {label:'A little space',note:'short reverb',arp:[64,67,69,67],space:.45,
      say:'<b>A little space.</b> The notes now have a room around them. This is the setting most parts want.'},
     {label:'Far away',note:'heavy reverb',arp:[64,67,69,67],space:1,
      say:'<b>Far away.</b> Atmospheric, and the attack of each note has gone soft. Fine for a pad, wrong for a lead or a snare.'}],

 title:'Export and revise', short:'Produce the two different files a finished song needs, then make a second version.',
 time:14, chapter:2, module:'Finishing', tag:'Project vs export', lab:'project',
 opens:'By the end you know the difference between a project and an export, and you have a plan for a second version.',
 blocks:[
  {h:'Two different things, both called “the song”',
   p:['A <b>project</b> is the editable document: every track, region, plug-in and fader position, with the parts still separate. It only opens in the program that made it, and it is where you go back to change something.',
      'An <b>export</b> (or bounce, or mixdown) is a single audio file — MP3, WAV, AAC — with all of those parts summed into one stereo waveform. It plays anywhere and cannot be taken apart again. You need both, and confusing them is how people lose work: sending someone an MP3 is sharing the song, but it is not a backup of the project.'],
   fig:{kind:'timeline',bars:16,bw:28,laneWidth:94,
    sections:[{from:1,to:16,name:'One stereo file after export',tone:'pale'}],
    lanes:[
     {name:'Chords',tone:'green',spans:[{from:1,to:16,label:'editable region'}]},
     {name:'Bass',tone:'slate',spans:[{from:5,to:12,label:'editable region'}]},
     {name:'Drums',tone:'blue',spans:[{from:5,to:12,label:'editable region'}]},
     {name:'Lead',tone:'orange',spans:[{from:9,to:12,label:'editable region'}]},
     {name:'Export',tone:'rust',spans:[{from:1,to:16,label:'song.wav — one waveform, nothing separable'}]}],
    alt:'Four editable tracks above a single flat exported waveform spanning all sixteen bars.',
    caption:'Above the line, the <b>project</b>: four tracks you can still mute, move and re-mix. Below it, the <b>export</b>: one file covering the same sixteen bars, with the four parts permanently summed. Everything above is recoverable; nothing below is.'}},
  {h:'Which format, and when',
   p:['<b>WAV</b> and <b>AIFF</b> are uncompressed: full quality, large files, and what you send to anyone who will do further work on the audio. <b>MP3</b> and <b>AAC</b> are compressed: a fraction of the size, slightly reduced quality, and right for sharing, messaging and listening.',
      'Export a WAV as your archive copy and an MP3 to send around. Never work from an MP3 — compression is lossy, and exporting an MP3 of an MP3 degrades it again.']},
  {h:'Check the ends before you export',
   p:['Two mistakes account for most ruined exports. The first is a cut-off ending: the export range stops at the last bar while the final chord is still ringing. Extend the range a bar or two past the last note.',
      'The second is clipping on the master. Individual tracks can each sit safely below the ceiling and still add up to something over it. Watch the master meter through the loudest section — usually the chorus — and if it touches the top, lower the master fader rather than any individual part, so the balance you worked on survives.'],
   fig:{kind:'meters',track:280,laneWidth:116,
    rows:[
     {name:'Before',value:100,tone:'rust',label:'master clipping',note:'balance is fine, sum is not'},
     {name:'Master −3 dB',value:84,tone:'green',label:'safe',note:'same mix, now exportable'}],
    alt:'Two master meters, the first clipped at the top and the second lowered to about five sixths.',
    caption:'Parts that are each safe can still add up past the ceiling. Pull the <b>master</b> down rather than any single track: every balance decision you made is preserved, and the file no longer clips.'}},
  {h:'Then make a second version',
   p:['A first song teaches you most of what it has to teach in its second version. Keep the tempo, the key and the first three notes of the hook, then change one thing deliberately: a different last chord, the hats removed for a bar before the hook, a new ending.',
      'Export both and listen to them back to back, paying attention to the moment the hook enters. Comparing two versions of your own work tells you more than listening to either one ten times, because the difference is the only variable.'],

    title:'Write the second version of the hook',

    say:'Keep what works, change one thing. That is revision, and it is most of what writing actually is.'}},
  {h:'Keep a short log',
   p:['Write down the tempo, the key, which instrument played which part, and one sentence on what you would change. Three lines is enough. In a month you will not remember any of it, and the note is the difference between building on this song and starting over.',
      'Save the project file somewhere that is backed up, with a name that includes a version number. “window-seat-v2” costs nothing and has saved more music than any plug-in.']}

function synth(){return `<div class="instrument-stage"><div class="synth" aria-label="Playable pocket synthesizer"><div class="machine-top"><div><span class="machine-name">Roomtone</span> <span class="machine-micro">Pocket keys</span></div><div class="speaker" aria-hidden="true"></div></div><div class="machine-controls"><div class="display"><span id="synth-readout">C MAJOR</span><svg viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true"><path d="M0 8 Q5 -3 10 8 T20 8 T30 8 T40 8 T50 8 T60 8 T70 8 T80 8 T90 8 T100 8" fill="none" stroke="#c9daa3" stroke-width="1"/></svg></div><div class="pads" aria-label="Chord pads">${Object.keys(harmony).map(c=>`<button data-chord="${c}" aria-label="Play ${c} chord">${c}</button>`).join('')}</div><label class="volume"><span class="machine-micro">Volume</span><input data-volume type="range" min="0" max="100" value="${Math.round(StudioAudio.volume*100)}"></label></div>${keyboard(true)}<div class="synth-legend"><span><i class="led"></i> Ready to play</span><span>Q row low · Z row high · [ ] octave</span></div></div></div>`;}
function home(){
 const next=course.findIndex((_,i)=>!done.has(i));
 return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${logo()} The songwriting workbook</div><h1>From the first beat<br>to <em>your first song.</em></h1><p>Learn the building blocks of music, try them by ear, and bring a song to life in GarageBand.</p><div class="actions">${button('lesson/'+(next<0?1:next+1),(done.size&&next>=0?'Continue learning':'Start learning')+' <span aria-hidden="true">→</span>','warm')}<button class="listen" data-song><span class="circle-play" aria-hidden="true">▶</span><span data-song-label>Hear the song</span></button><a class="listen" href="#freestyle">Freestyle studio ↗</a></div></div>${synth()}</section>
 <section class="section"><div class="sec-head"><div><h2>Your learning path</h2><p>${course.length} lessons in three chapters. Theory first, then writing, then the studio.</p></div>${link('lessons','View all lessons')}</div><div class="chapter-cards">${chapters.map((_,j)=>chapterCard(j)).join('')}</div></section>
 <section class="section"><div class="sec-head"><h2>On the music stand</h2>${progress()}</div><div class="tools">${[['practice','♬','Practice room','Genre templates, keys and ear training'],['garageband','≋','GarageBand guide','Record on Mac, iPhone or iPad'],['reference','▤','Cheat sheet','Chords, rhythm and recording controls']].map(([u,icon,t,d])=>`<a href="#${u}" class="tool"><span aria-hidden="true" class="tool-icon">${icon}</span><span><b>${t}</b><small>${d}</small></span></a>`).join('')}</div></section>`;
}
function staffReference(){const names=['C4','D4','E4','F4','G4','A4','B4','C5'];const notes=names.map((name,i)=>{const x=45+i*48+(i>=4?10:0),y=83-i*5;const stem=i>=6?`<path d="M${x-5} ${y}v28"/>`:`<path d="M${x+5} ${y}v-28"/>`;return `<g fill="#2d4d3b" stroke="#2d4d3b">${!i?`<path d="M${x-11} ${y}h22"/>`:''}<ellipse cx="${x}" cy="${y}" rx="6.5" ry="4.7" transform="rotate(-20 ${x} ${y})"/>${stem}</g><text x="${x}" y="108" text-anchor="middle" fill="#3f5747" font-size="12">${name}</text>`;}).join('');
return `<section class="panel staff-panel"><div class="micro">Side note</div><h2>Reading a treble staff</h2><p>You do not need this to finish the course — nothing later depends on it — but written music uses the same note names you just learned, arranged by height on five lines.</p><p>Read from left to right. One step from a line to its neighboring space moves to the next letter name. In treble clef, the bottom line is E4. Middle C (C4) sits on a short ledger line below it.</p><svg role="img" aria-label="Two bars of ascending quarter notes in treble clef, from middle C to C5." viewBox="0 0 445 120">${[33,43,53,63,73].map(y=>`<path d="M12 ${y}h418" stroke="#8a9c89"/>`).join('')}<text x="10" y="68" font-family="Apple Symbols,serif" font-size="52" fill="#355442">𝄞</text><path d="M213 33v40M426 33v40" stroke="#516b56"/>${notes}</svg><p class="compact">The five lines from bottom to top are E G B D F. The spaces are F A C E. Sing the labeled notes in order, then cover the labels and name them again.</p></section>`;}

function lessons(){
 return bread('Lessons')+heading('Your learning path','Three chapters, taken in order. Music theory comes first and comes complete, because everything after it uses its vocabulary. Then writing a song, then the studio work of recording, editing and mixing.')
 +progress()+`<div class="chapter-cards">${chapters.map((_,j)=>chapterCard(j)).join('')}</div>`
 +`<p class="compact top-gap">${course.length} lessons, roughly ${Math.round(courseMinutes()/6)/10} hours if you do the exercises as you go. Each lesson ends with a check you should be able to pass from memory before moving on.</p>`;
}
function chapterPage(j){
 const ch=chapters[j], list=chapterLessons(j), got=chapterDone(j);
 const byModule=ch.modules.map(m=>[m,list.filter(([l])=>l.module===m)]).filter(([,xs])=>xs.length);
 const next=list.find(([,i])=>!done.has(i))||list[0];
 return `<div class="bread"><a href="#lessons">Lessons</a><span aria-hidden="true">/</span><span>${esc(ch.name)}</span></div>`
 +heading(ch.name,ch.blurb,`Chapter ${num(j+1)} of ${chapters.length} · ${list.length} lessons · ${chapterTime(j)} min`)
 +`<div class="row-between chapter-bar"><div class="progressbox"><div class="progressbar"><i style="width:${got/list.length*100}%"></i></div><span>${got} / ${list.length} in this chapter</span></div>${button('lesson/'+(next[1]+1),(got?'Continue':'Start')+' chapter '+num(j+1)+' <span aria-hidden="true">→</span>','warm')}</div>`
 +byModule.map(([m,xs])=>`<section class="chapter" data-module="${esc(m)}" data-count="${xs.length}"><div class="module-head"><h2>${esc(m)}</h2><span class="micro">${xs.length} lesson${xs.length===1?'':'s'}</span></div><div class="cards">${xs.map(([,i])=>card(i,xs.length===1)).join('')}</div></section>`).join('')
 +`<div class="lesson-tools">${j?link('chapter/'+j,'Previous chapter'):link('lessons','All chapters')}${j<chapters.length-1?button('chapter/'+(j+2),'Next chapter →'):button('project','Finish the song project →')}</div>`;
}
// One numbered step per idea, each ending in a picture of what was just said
// or a widget that does it. The old lesson was two paragraphs and a table,
// which is why it read as a jump rather than a progression.
function lblock(b,n){
 return `<section class="lblock"><span class="lblock-no" aria-hidden="true">${num(n)}</span><div class="lblock-body"><h3>${b.h}</h3>${b.p.map(x=>`<p>${x}</p>`).join('')}${drawFigure(b.fig)}${drawWidget(b.widget)}</div></section>`;
}
function lessonRail(i){
 const list=chapterLessons(course[i].chapter);
 return `<ol class="lesson-rail">${list.map(([x,j])=>`<li class="rail-item${j===i?' here':''}${done.has(j)?' got':''}"><a href="#lesson/${j+1}"><span class="rail-no">${num(j+1)}</span><span>${esc(x.title)}</span></a></li>`).join('')}</ol>`;
}
function lesson(i){

 const list=chapterLessons(l.chapter), at=list.findIndex(([,j])=>j===i)+1;
 return `<div class="bread"><a href="#lessons">Lessons</a><span aria-hidden="true">/</span><a href="#chapter/${l.chapter+1}">${esc(ch.name)}</a><span aria-hidden="true">/</span><span>${esc(l.module)}</span></div>`
 +heading(l.title,l.short,`Chapter ${num(l.chapter+1)} · ${esc(l.module)} · lesson ${at} of ${list.length} · ${l.time} min`)
 +`<div class="layout"><div class="stack">`
 +`<section class="panel lesson-opens"><div class="micro">What this lesson gives you</div><p>${l.opens}</p></section>`
 +`<article class="panel lesson-read">${l.blocks.map((b,n)=>lblock(b,n+1)).join('')}</article>`
 +(l.tag==='Finding C'?staffReference():'')
 +`<section class="panel"><h2>Reference</h2><p class="table-lead">${l.tableLead}</p>${table(l.cols,l.rows)}</section>`
 +`<section class="panel soft"><h2>In short</h2><ul class="recap-list">${l.recap.map(r=>`<li>${r}</li>`).join('')}</ul></section>`
 +`<section class="panel"><h2>Try it yourself</h2><ol>${l.steps.map(x=>`<li>${x}</li>`).join('')}</ol>${button(route,'Open '+lab+' ↗','ghost')}</section>`
 +`<section class="panel soft"><h2>In GarageBand</h2><p>${l.gb}</p>${link('garageband','Open the device guide')}</section>`
 +`<section class="panel quiz-panel"><div class="micro">Check yourself</div><h2>${l.question}</h2><div class="answers">${l.choices.map((c,j)=>`<button data-quiz="${j}" data-lesson="${i}">${esc(c)}</button>`).join('')}</div><p class="result" id="quiz-result" role="status"></p></section>`
 +`</div><aside class="aside lesson-aside"><div class="micro">Before moving on</div><h2>Can you do this yet?</h2><p>${l.test}</p><label class="check-line"><input type="checkbox" data-complete="${i}" ${done.has(i)?'checked':''}><span>I can do this from memory.</span></label><div class="divider"></div><div class="micro">${esc(ch.name)}</div>${lessonRail(i)}</aside></div>`
 +`<div class="lesson-tools">${link(i?'lesson/'+i:'chapter/'+(l.chapter+1),i?'Previous lesson':'Chapter contents')}${button(i<course.length-1?'lesson/'+(i+2):'project',i<course.length-1?'Next lesson →':'Finish the song project →')}</div>`;
}
function tabs(items,active,prefix){return `<div class="tabs">${items.map(([id,label])=>`<a href="#${prefix}/${id}" ${id===active?'aria-current="page"':''}>${label}</a>`).join('')}</div>`;}
function keyLab(){const ns=scales[scaleKey];
 return `<section class="panel"><h2>Keys & harmony</h2><p>Play with your computer keyboard or tap the keys below. Hold several keys together to play a chord. Dots mark the notes in the selected scale. Chord pads below use C as their root for comparing colors.</p><div class="control-row"><label>Scale <select data-scale>${Object.keys(scales).map(k=>`<option ${k===scaleKey?'selected':''}>${k}</option>`).join('')}</select></label><label>Sound <select data-wave>${['triangle','sine','sawtooth'].map((s,i)=>`<option value="${s}" ${wave===s?'selected':''}>${['Soft keys','Pure tone','Bright synth'][i]}</option>`).join('')}</select></label></div>${keyboard()}${keyboardHelp()}<div class="chart">${ns.map(pitchLabel).join(' · ')}</div><div class="pill-row"><button class="btn" data-playscale>▶ Play scale</button><button class="pill" data-triad="0,4,7">C major</button><button class="pill" data-triad="0,3,7">C minor</button><button class="pill" data-triad="4,7,12">C first inversion</button><button class="pill" data-triad="7,12,16">C second inversion</button></div><p id="key-feedback" class="result" role="status">Choose a key or chord.</p></section>`;

const intervals=[[2,'Major second'],[3,'Minor third'],[4,'Major third'],[7,'Perfect fifth'],[12,'Octave']];
function earLab(){return `<section class="panel"><h2>Hear the interval</h2><p>Hear two ascending notes. Sing both back, then identify the distance. Each new round starts from a different possible pitch.</p><div class="control-row"><button class="btn" data-ear-new>▶ ${ear?'New pair':'Hear a pair'}</button><button class="btn ghost" data-ear-repeat ${ear?'':'disabled'}>Replay pair</button></div><div class="answers">${intervals.map(([n,name])=>`<button data-interval="${n}" ${ear?'':'disabled'}>${name}</button>`).join('')}</div><p id="ear-feedback" class="result" role="status">${ear?'Listen, sing, then choose an interval.':''}</p></section>`;}

function describeSize(steps,bar){

 return `${steps} steps · ${bars} ${bars===1?'bar':'bars'} · ${note}`;
}
function keyboard(mini=false){
 const first=keyboardBase();
 const banks=pianoBanks.map((bindings,bank)=>{
  const start=first+12*bank, whiteTotal=bank===0?7:8;
  let whiteCount=0;
  const buttons=bindings.map((key,step)=>{
   const note=start+step,black=blackSteps.has(step),label=pitchLabel(note);
   const scaleTone=scales[scaleKey].some(n=>n%12===note%12);
   const style=black?` style="left:${whiteCount/whiteTotal*100}%;width:${.64/whiteTotal*100}%"`:'';
   if(!black)whiteCount++;
   const face=mini||black?key:label;
   const badge=!mini&&!black?`<b class="letter-badge">${key}</b>`:'';
   return `<button type="button" class="${black?'blackkey':'whitekey'} ${!mini&&scaleTone?'inscale':''}" data-note="${note}" aria-label="Play ${label} with ${key}" aria-pressed="false" title="${label} · ${key}"${style}><span>${face}</span>${badge}</button>`;
  }).join('');
  return `<div class="piano-bank" role="group" aria-label="${bank===0?'Lower':'Higher'} register, ${pitchLabel(start)} to ${pitchLabel(start+bindings.length-1)}">${buttons}</div>`;
 });
 return `<div class="${mini?'mini-keys':'lab-keys'}" role="group" aria-label="Playable keyboard">${banks.join('')}</div>`;
}
function keyboardHelp(){
 const first=keyboardBase();
 const rows=pianoBanks.map((keys,i)=>{
  const whites=keys.filter((_,n)=>!blackSteps.has(n)).join(' ');
  const blacks=keys.filter((_,n)=>blackSteps.has(n)).join(' ');
  return `<tr><th scope="row">${pitchLabel(first+i*12)}–${pitchLabel(first+i*12+keys.length-1)}</th><td><kbd>${whites}</kbd></td><td><kbd>${blacks}</kbd></td></tr>`;
 });
 return `<div class="key-controls"><table class="key-map"><thead><tr><th>Register</th><th>White keys</th><th>Black keys</th></tr></thead><tbody>${rows.join('')}</tbody></table><div class="octaves"><span>Shift octaves</span><button data-oct="-1" aria-label="Lower both registers, left bracket" ${octave<=-2?'disabled':''}>[ −</button><output>${pitchLabel(first)}–${pitchLabel(first+24)}</output><button data-oct="1" aria-label="Raise both registers, right bracket" ${octave>=2?'disabled':''}>+ ]</button></div></div>`;
}
function playLive(id,note,el,velocity){
 if(activeKeys.has(id))return;
 const room=!!$('#piano-room');
 const stage=!!$('#freestyle-board'),patch=room?piano.voice:stage?mix.sound:$('.mini-keys')?'piano':wave;
 if(stage&&MusicEngine.setup())MusicEngine.setMix(mix);
 let options={bus:stage?'live':undefined};
 if(room){
  // A MIDI key reports how hard it was struck; a computer key cannot, so the
  // Touch control stands in for it.
  const v=Number.isFinite(velocity)?Math.max(1,Math.min(127,velocity)):null;
  options={level:v===null?touchLevels[piano.touch-1]:.06+(v/127)*.40,
           cutoff:v===null?touchCutoffs[piano.touch-1]:1200+(v/127)*5000};
 }
 const release=MusicEngine.play(note,patch,options);
 activeKeys.set(id,{note,release,el,pedal:room});el?.classList.add('held');el?.setAttribute('aria-pressed','true');
 const readout=$('#piano-note')||$('#synth-readout')||$('#key-feedback')||$('#live-note');
 if(readout)readout.textContent=[...new Set([...activeKeys.values()].map(k=>pitchLabel(k.note)))].join(' · ');
}
function releaseKey(id){
 const held=activeKeys.get(id);if(!held)return;
 // With the pedal down the damper stays off: hold the note and let it ring.
 if(pedalDown&&held.pedal)sustained.add(held.release);else held.release();
 activeKeys.delete(id);
 if(![...activeKeys.values()].some(k=>k.el===held.el)){held.el?.classList.remove('held');held.el?.setAttribute('aria-pressed','false');}
}
function releaseKeys(){
 for(const id of activeKeys.keys())releaseKey(id);
 for(const release of sustained)release();
 sustained.clear();pedalDown=false;
}
function setPedal(on){
 if(on===pedalDown)return;
 pedalDown=on;
 if(!on){for(const release of sustained)release();sustained.clear();}
 const b=$('[data-pedal]');
 if(b){b.setAttribute('aria-pressed',String(on));b.classList.toggle('down',on);}
}
function shiftOctave(amount){
 const next=Math.max(-2,Math.min(2,octave+amount));if(next===octave)return;
 releaseKeys();octave=next;
 const keys=$('.mini-keys,.lab-keys');if(keys)keys.outerHTML=keyboard(keys.classList.contains('mini-keys'));
 if($('#piano-room'))refreshPiano();
 const help=$('.key-controls');if(help)help.outerHTML=keyboardHelp();
 const display=$('#synth-readout')||$('#live-note')||$('#key-feedback');if(display)display.textContent='Keyboard starts on '+pitchLabel(keyboardBase());
}
function selectedPreset(deck=false){return beatsLibrary.find(t=>t.id===(deck?deckPresetId:presetId))||beatsLibrary[0];}
function genrePicker(deck=false){
 const t=selectedPreset(deck),families=[...new Set(beatsLibrary.map(p=>p.family))];
 const actions=deck
  ?`<label>Parts to load<select data-load-target>${Object.entries({both:'Drums + bass',drums:'Drums only',bass:'Bass only'}).map(([id,label])=>`<option value="${id}" ${rhythmTarget===id?'selected':''}>${label}</option>`).join('')}</select></label><button class="btn" data-load-rhythm>Load into ${activeScene}</button>`
  :'<button class="btn" data-load>Load template</button>';
 const hint=deck
  ?`Suggested bass part · ${bassStyles[genreBassParts[t.family]].name}. Loading keeps the current tempo.`
  :'Loading sets the tempo, meter and drum hits. Edit any hit in the beat grid.';
 return `<section class="genre-box${deck?' deck-genres':''}" ${deck?'data-deck-templates':''}>

  <div class="template-controls"><label>Style family<select data-family>${families.map(f=>`<option ${f===t.family?'selected':''}>${esc(f)}</option>`).join('')}</select></label>
   <label>Template<select data-template>${beatsLibrary.filter(p=>p.family===t.family).map(p=>`<option value="${p.id}" ${p===t?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label></div>
  <div class="audition-info"><b>${esc(t.name)} · ${t.bpm} BPM · ${t.meter}</b><p>${t.cue}</p></div>
  <div class="pill-row"><button class="pill" data-preview ${MusicEngine.recording?'disabled':''}>${StudioAudio.current==='preview'?'■ Stop preview':'▷ Preview beat'}</button>
   ${actions}<button class="pill" data-pattern-midi>↓ Template MIDI</button>${!deck&&previousGroove?'<button class="pill" data-undo-load>Undo load</button>':''}</div>
  <p class="compact">${hint}</p></section>`;
}

function tempoControl(label='Tempo'){return `<label class="tempo-control">${label} <input type="range" min="45" max="210" value="${bpm}" data-tempo><span><output data-bpm-output>${bpm}</output> BPM</span></label>`;}
function showGroove(){return `${esc(grooveName)} · ${meterName} · ${getSteps()} steps`;}
function showDeckGroove(){

 return `${activeScene} · ${drums.name} · ${drums.meter} · ${loopSpan(drums)/drumStride(drums)} steps`;
}
function gridContent(){
 const bar=getBar(),stride=getStride(),perBar=bar/stride,div=meters[meterName].div/stride;
 const names=div===2?['','&']:div===4?['','e','&','a']:div===3?['','tri','plet']:['','+','tri','+','plet','+'];
 let html='';
 for(let start=0;start<getSteps();start+=perBar){
  let cells='<span class="lane-label">Sound</span>';const barNumber=start/perBar+1;
  for(let i=0;i<perBar;i++){const label=i%div===0?1+Math.floor(i/div):names[i%div];cells+=`<span class="count ${i%div===0?'down':''}" data-column="${start+i}">${label}</span>`;}
  kit.forEach(([id,name],r)=>{
   cells+=`<button class="audition-lane" data-hit="${id}" title="Play ${name}">${name}</button>`;
   for(let i=0;i<perBar;i++){
    const col=start+i;
    cells+=`<button class="step ${id} ${i%div===0?'down':''}" data-row="${r}" data-col="${col}" aria-label="${name}, bar ${barNumber}, step ${i+1}" aria-pressed="${!!beat[r][col*stride]}"></button>`;
   }
  });
  html+=`<div class="grid-bar"><div class="micro">Bar ${barNumber}</div><div class="grid-scroll"><div class="beat-grid extended" style="--columns:${perBar};--grid-min:${70+perBar*30}px">${cells}</div></div></div>`;
 }
 return html;
}
function sequencerPanel(){
 return `<section class="panel sequencer"><div class="row-between"><h2>Beat grid</h2>${link('freestyle','Play in freestyle')}</div><p>Tap a cell to add a hit. Tap a drum name to hear it in isolation. Longer patterns give you room to write a second-bar fill.</p><div class="control-row"><button data-grid-play class="btn">▶ Play beat</button>${tempoControl()}<label><input type="checkbox" data-click ${clickOn?'checked':''}> Metronome</label></div><div class="control-row"><label>Pattern length <select data-grid-size>${degrees.map(x=>`<option value="${x}" ${gridSize===x?'selected':''}>${describeSize(getBar()*x,getBar())}</option>`).join('')}</select></label><span class="compact">${bpmUnit()}</span></div><div class="row-between"><p class="current-groove">${showGroove()}</p><button class="pill" data-edited-midi>↓ Beat MIDI</button></div><div data-grid-body>${gridContent()}</div><div class="pill-row"><button class="pill" data-pattern="base">Load backbeat</button><button class="pill" data-pattern="verse">Load verse</button><button class="pill" data-pattern="empty">Clear grid</button></div><p class="compact">Shorter views keep the hidden steps for when you expand again. Clear grid clears all four bars. Undo load restores the preceding pattern.</p></section>`;
}
function beatGrid(){return sequencerPanel()+genrePicker();}
function bpmUnit(){return `Count one ${meters[meterName].unit} per BPM pulse.`;}
function beatAt(rows,step,stride,t,bus,keep){
 kit.forEach(([id],r)=>{if(rows[r][step*stride]&&(!keep||keep(id,r)))MusicEngine.hit(id,t,step*stride%2?.63:.85,bus);});
}
function markGrid(i){
 $$('.beat-grid .now').forEach(b=>b.classList.remove('now'));$$(`[data-column="${i}"],[data-col="${i}"]`).forEach(b=>b.classList.add('now'));
}
function startGrid(){
 const stride=getStride(),div=meters[meterName].div/stride;
 StudioAudio.sequence('grid',getSteps(),()=>bpm,(i,t)=>{
  beatAt(beat,i,stride,t);if(clickOn&&i%div===0)MusicEngine.hit(i%(getBar()/stride)===0?'accent':'click',t,.62);
 },markGrid,true,div,i=>swingLength(i,div,swing));
}
function audition(deck=false){

 if(MusicEngine.recording)return;
 const t=selectedPreset(deck),m=meters[t.meter],rows=patternFrom(t),bar=m.beats*m.div;
 StudioAudio.sequence('preview',2*bar,()=>t.bpm,(i,when)=>beatAt(rows,i,1,when),null,false,m.div,i=>swingLength(i,m.div,t.swing));
}
function snapshot(){return {meterName,gridSize,swing,bpm,beat:beat.map(r=>[...r]),grooveName};}
function syncGrooveUI(was){
 if($('.sequencer'))$('.sequencer').outerHTML=sequencerPanel();
 replacePicker();$$('[data-bpm-output]').forEach(o=>o.textContent=bpm);$$('[data-tempo]').forEach(e=>e.value=bpm);
 updateBoard();saveBeat();
 if(was==='grid')startGrid();else if(was==='freestyle')startDecks();else if(was==='preview')StudioAudio.stop();
}
function loadGroove(t,keepTempo=false){
